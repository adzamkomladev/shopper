name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CF_SEND_TELEMETRY: "false"
  TEST_DATABASE_URL: postgresql://shopper:shopper_ci_only@127.0.0.1:5432/shopper
# Every job runs on its own runner, so the static checks, the build and each test shard finish side by side.
# `ci` is the one required check: it passes only when every job above it passed.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: vp check
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: vp run guard
      # Shipped dependencies only; a high or critical advisory fails the build until it is bumped or overridden.
      - run: vp pm audit --production --level high
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: vp run typecheck
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: vp run build
  integration:
    name: integration (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services: &services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shopper
          POSTGRES_PASSWORD: shopper_ci_only
          POSTGRES_DB: shopper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopper -d shopper"
          --health-interval 2s --health-timeout 5s --health-retries 30
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: shopper_dev_access
          RUSTFS_SECRET_KEY: shopper_dev_secret_at_least_32_chars
          RUSTFS_VOLUMES: /data
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5183,http://127.0.0.1:5183,http://localhost:5185,http://127.0.0.1:5185
        ports: ["9200:9000"]
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          storage: "true"
          browsers: "true"
      - run: vp test --run --shard=${{ matrix.shard }}/4
  e2e:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services: *services
    env:
      E2E_DATABASE_URL: postgresql://shopper:shopper_ci_only@127.0.0.1:5432/shopper_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          storage: "true"
          browsers: "true"
      - run: vp exec playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
  e2e-public:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *services
    env:
      E2E_DATABASE_URL: postgresql://shopper:shopper_ci_only@127.0.0.1:5432/shopper_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          storage: "true"
          browsers: "true"
      - run: vp exec playwright test --config playwright.public.config.ts --output test-results/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-public
          path: test-results/
  till-windows:
    # The NSIS installer end to end: build it, install it silently, start it fresh and see the enrol window load.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: vp run till:package -- --win nsis --x64
      - name: Install, start and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/till/electron/release/Shopper-Setup-*-x64.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          # Per-user NSIS installs under the package name; the silent installer returns before its files land.
          $dir = "$env:LOCALAPPDATA\Programs\shopper-register"
          $app = "$dir\Shopper.exe"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $app); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $app)) { throw "The installer did not put Shopper.exe at $app" }
          # Nothing answers on port 9: a fresh till only needs an upstream to write register.json and show enrolment.
          $env:SHOPPER_TILL_UPSTREAM = "http://127.0.0.1:9"
          $env:SHOPPER_TEST_NO_DIALOG = "1"
          Start-Process $app -ArgumentList "--remote-debugging-port=9333"
          $loaded = $false
          for ($i = 0; $i -lt 90 -and -not $loaded; $i++) {
            Start-Sleep 2
            try {
              $pages = Invoke-RestMethod http://127.0.0.1:9333/json/list
              $loaded = [bool]($pages | Where-Object { $_.url -match '^http://127\.0\.0\.1:\d+/(#|$)' })
            } catch {}
          }
          Get-Process Shopper -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $loaded) { throw "The installed register never opened its window from its host" }
          if (-not (Test-Path "$env:APPDATA\Shopper\register.json")) { throw "First run wrote no register.json" }
          Start-Process "$dir\Uninstall Shopper.exe" -ArgumentList "/S" -Wait
  ci:
    if: always()
    needs: [check, guard, typecheck, build, integration, e2e, e2e-public, till-windows]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
