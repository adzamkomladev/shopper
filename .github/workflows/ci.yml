name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shopper
          POSTGRES_PASSWORD: shopper_ci_only
          POSTGRES_DB: shopper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopper -d shopper"
          --health-interval 2s --health-timeout 5s --health-retries 30
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: shopper_dev_access
          RUSTFS_SECRET_KEY: shopper_dev_secret_at_least_32_chars
          RUSTFS_VOLUMES: /data
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5183,http://127.0.0.1:5183
        ports: ["9200:9000"]
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://shopper:shopper_ci_only@127.0.0.1:5432/shopper
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.21.0"
          version: "1.0.0"
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run storage:setup
      - run: vp check
      - run: vp run guard
      - run: vp test --run
      - run: vp run build
      - run: vp run typecheck
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shopper
          POSTGRES_PASSWORD: shopper_ci_only
          POSTGRES_DB: shopper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopper -d shopper"
          --health-interval 2s --health-timeout 5s --health-retries 30
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: shopper_dev_access
          RUSTFS_SECRET_KEY: shopper_dev_secret_at_least_32_chars
          RUSTFS_VOLUMES: /data
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5183,http://127.0.0.1:5183
        ports: ["9200:9000"]
        options: >-
          --health-cmd "curl --fail http://localhost:9000/health"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://shopper:shopper_ci_only@127.0.0.1:5432/shopper
      E2E_DATABASE_URL: postgresql://shopper:shopper_ci_only@127.0.0.1:5432/shopper_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.21.0"
          version: "1.0.0"
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run storage:setup
      - run: vp exec playwright install --with-deps chromium
      - run: vp run e2e
      - run: vp exec playwright test --config playwright.public.config.ts --output test-results/public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
