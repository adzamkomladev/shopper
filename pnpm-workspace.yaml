packages:
  - apps/*
  - apps/till/*
  - packages/*
  - packages/adapters/*
  - packages/db/*
  - tests
  - tooling/worker/tests
catalog:
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  # Transitive packages held back by their parents; each pin is the first release past a high or moderate advisory.
  "undici@>=7 <7.30.1": 7.30.1
  "seroval@<1.6.11": 1.6.12
  "zod@>=4 <4.6.6": 4.6.7
  "fflate@>=0.7 <0.7.5": 0.7.5
allowBuilds:
  esbuild: true
  workerd: true
  # Prebuilt N-API binaries are used; their install scripts would only compile from source.
  "@serialport/bindings-cpp": false
  # Squirrel installer support; we build NSIS.
  electron-winstaller: false
peerDependencyRules:
  allowAny:
    - vite
minimumReleaseAgeExclude:
  - "@cloudflare/build-output-utils@0.9.3"
  - "@cloudflare/config@0.27.0"
  - "@cloudflare/runtime-types@0.1.12"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.1"
  - "@cloudflare/vitest-plugin@1.4.4"
  - miniflare@5.20261012.1-beta || 5.20261019.1-beta
  - wrangler@4.151.3
