name: shopper-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: shopper
      POSTGRES_PASSWORD: shopper_dev_only
      POSTGRES_DB: shopper
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopper -d shopper"]
      interval: 2s
      timeout: 5s
      retries: 30
  rivet:
    image: rivetdev/engine:2.3.23
    environment:
      RIVET__FILE_SYSTEM__PATH: /data
      RIVET__AUTH__ADMIN_TOKEN: shopper_local_development_only
    ports: ["127.0.0.1:6420:6420"]
    volumes: ["rivet-data:/data"]
  printer:
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    ports: ["127.0.0.1:9100:9100"]
    volumes:
      - ./printer/server.mjs:/app/server.mjs:ro
      - ./printer/captures:/captures
volumes:
  postgres-data:
  rivet-data:
