# Project defaults for Codex. Model per kind of work and its effort band: docs/engineering/ai-workflow.md ("Picking a Codex model").
model = "gpt-6.1-sol"
model_reasoning_effort = "low" # Sol stays light: "medium" for complex work, never higher
plan_mode_reasoning_effort = "medium"

[agents]
max_concurrent_threads_per_session = 4

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.shadcn]
command = "vp"
args = ["dlx", "shadcn@4.21.4", "mcp"]

[mcp_servers.playwright]
command = "node"
args = ["tooling/mcp/playwright.mjs"]

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
