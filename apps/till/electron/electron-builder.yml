# Run through tooling/build/package.ts, which stages the app dir and supplies version, electronDist and output.
appId: com.shopper.register
productName: Shopper
asar: true
asarUnpack: ["**/*.node", "**/*.wasm"]
# better-sqlite3-multiple-ciphers and serialport ship N-API prebuilds, so nothing is rebuilt for Electron.
npmRebuild: false
win:
  target: [{ target: nsis, arch: [x64] }]
linux:
  target: [dir]
  category: Office
