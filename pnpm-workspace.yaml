packages:
  - apps/*
  - apps/till/*
  - packages/*
  - packages/adapters/*
  - packages/db/*
  - tests
  - tooling/worker/tests
catalog:
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
allowBuilds:
  esbuild: true
  workerd: true
peerDependencyRules:
  allowAny:
    - vite
minimumReleaseAgeExclude:
  - "@cloudflare/build-output-utils@0.9.3"
  - "@cloudflare/config@0.27.0"
  - "@cloudflare/runtime-types@0.1.12"
  - "@cloudflare/vite-plugin@2.0.0-beta.v.1"
  - "@cloudflare/vitest-plugin@1.4.4"
  - miniflare@5.20261012.1-beta
  - wrangler@4.151.1
