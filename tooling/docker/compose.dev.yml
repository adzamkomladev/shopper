name: shopper-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: shopper
      POSTGRES_PASSWORD: shopper_dev_only
      POSTGRES_DB: shopper
    ports: ["127.0.0.1:${SHOPPER_POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopper -d shopper"]
      interval: 2s
      timeout: 5s
      retries: 30
  rivet:
    image: rivetdev/engine:3.0.0-preview.3
    environment:
      RIVET__STORAGE__LOG_DIRECTORY: /data
      RIVET__STORAGE__AUTO_PROVISION_PARTITIONS: "true"
      RIVET__OBJECT_STORAGE__PRIMARY__FILE_SYSTEM__PATH: /data/objects
      RIVET__AUTH__ADMIN_TOKEN: shopper_local_development_only
    ports: ["127.0.0.1:6420:6420"]
    volumes: ["rivet3-data:/data"]
  rustfs:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: shopper_dev_access
      RUSTFS_SECRET_KEY: shopper_dev_secret_at_least_32_chars
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5183,http://127.0.0.1:5183
    ports: ["127.0.0.1:9200:9000"]
    volumes: ["rustfs-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
  printer:
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    ports: ["127.0.0.1:9100:9100"]
    volumes:
      - ../printer/server.mjs:/app/server.mjs:ro
      - ../printer/captures:/captures
volumes:
  postgres-data:
  rivet3-data:
  rustfs-data:
